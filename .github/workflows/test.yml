name: Test

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    concurrency:
      group: tsc-lint-pr${{ github.event.number }}-${{ matrix.version }}
      cancel-in-progress: true
    timeout-minutes: 15

    strategy:
      matrix:
        version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7
      - name: Setup node with cached node_modules
        uses: ./.github/actions/setup-node-cached
        with:
          node-version: ${{ matrix.version }}
      - name: Check l10nrc.schema.json is up to date
        run: |
          npm run schema -w packages/core
          if ! git diff --exit-code -- packages/core/l10nrc.schema.json; then
            echo "::error file=packages/core/l10nrc.schema.json::l10nrc.schema.json is out of date. Run 'npm run schema' in packages/core and commit the result."
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
